name: Diagnostico (temporal)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Construir
        env:
          GS_KEY: ${{ secrets.GS_KEY }}
        run: |
          python3 fetch_sheets.py
          python3 recalc.py "$(TZ=America/Argentina/Buenos_Aires date +%F)"
      - name: Medir
        run: |
          pip install playwright && playwright install --with-deps chromium
          python3 diag_run.py "$PWD/volumen_futuro.html"
      - name: Publicar resultado
        run: |
          git config user.name diag && git config user.email diag@x
          git checkout -b diag-out
          git add -f diag_out.json && git commit -qm diag && git push -f origin diag-out
