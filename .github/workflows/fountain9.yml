name: Fountain9 planes de reabasto

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1-5'   # 10:00 AR (lun–vie)
    - cron: '0 17 * * 1-5'   # 14:00 AR (lun–vie)

jobs:
  planes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Crear planes, esperar y descargar CSV
        env:
          F9_USER: ${{ secrets.F9_USER }}
          F9_PASS: ${{ secrets.F9_PASS }}
        run: python3 fountain9/run_planes.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: planes-fountain9
          path: descargas/
          if-no-files-found: warn
