name: Actualizar CD47

on:
  schedule:
    - cron: '15 11 * * *'   # 08:15 hora de Buenos Aires
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar planillas
        env:
          GS_KEY: ${{ secrets.GS_KEY }}
        run: python3 fetch_sheets.py
      - name: Recalcular
        run: |
          FECHA=$(TZ=America/Argentina/Buenos_Aires date +%F)
          python3 recalc.py "$FECHA"
      - name: Preparar sitio
        run: |
          mkdir -p site
          cp volumen_futuro.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
